# Coolify Nixpacks: no standalone "bun" provider; bun.lock otherwise pins an EOL Node 18 nixpkgs archive.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
# Node 22 nixpkgs snapshot (see nixpacks AVAILABLE_NODE_VERSIONS for 22)
nixpkgsArchive = "e6f23dc08d3624daab7094b701aa3954923c6bbb"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run db:generate"]

[start]
cmd = "npm run start"
